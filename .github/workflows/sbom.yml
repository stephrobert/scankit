name: SBOM

# Generates a CycloneDX/SPDX software bill of materials with Syft on every push to main and on
# each published release (attached as a release asset). Records exactly what scankit ships.

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions: {}

jobs:
  generate:
    name: Syft SBOM
    runs-on: ubuntu-24.04
    permissions:
      contents: write    # attach SBOM to release assets
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Anchore SBOM Action (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: scankit.spdx.json
          artifact-name: scankit.spdx.json
          upload-artifact: true
          upload-release-assets: ${{ github.event_name == 'release' }}
