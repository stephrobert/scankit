name: SBOM

# Generates a CycloneDX/SPDX software bill of materials with Syft on every push to main and on
# each published release (attached as a release asset). Records exactly what scankit ships.

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions: {}

jobs:
  generate:
    name: Syft SBOM
    runs-on: ubuntu-24.04
    permissions:
      contents: write    # attach SBOM to release assets
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Anchore SBOM Action (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: scankit.spdx.json
          artifact-name: scankit.spdx.json
          upload-artifact: true
          upload-release-assets: ${{ github.event_name == 'release' }}
