name: Release

# Tag-triggered release for the library. scankit ships no binary — the deliverable is the
# tagged Go module. GoReleaser is the recognized publishing workflow (Scorecard Packaging): it
# builds a reproducible source archive + checksums + SBOM and signs the checksums with Cosign
# (keyless). A native SLSA build-provenance attestation is then attached as a `*.intoto.jsonl`
# release asset (Scorecard Signed-Releases). Consumers get a verifiable, SBOM-documented release.

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release + upload assets
      id-token: write      # OIDC keyless (Cosign + SLSA provenance)
      attestations: write  # native GitHub attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod fait foi : `go-version: '1.26'` laisse setup-go réutiliser la
          # version déjà présente sur le runner (1.26.5), qui ne satisfait plus
          # la directive `go` du module avec GOTOOLCHAIN=local.
          go-version-file: go.mod
          cache: false # anti cache-poisoning on a tag-triggered release (zizmor GHA-23)

      - name: Verify the module builds and tests pass
        run: |
          go build ./...
          go test ./...

      - name: Install Syft (SBOM)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The release body comes from CHANGELOG.md, so the release page and the file cannot
      # drift. No section for the tag = the release stops here, before publishing: an empty
      # release note is a broken build, not a quiet default.
      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/release-notes.md"
          echo "Release body for $TAG:"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: GoReleaser (source archive, checksums, SBOM, Cosign)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Scorecard Signed-Releases looks for a `*.intoto.jsonl` asset ON the release. Attest the
      # GoReleaser artifacts and attach the provenance bundle as a release asset.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/scankit-*.tar.gz
            dist/checksums.txt

      - name: Attach provenance asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" provenance.intoto.jsonl
          gh release upload "$TAG" provenance.intoto.jsonl --clobber

      # goreleaser drops --release-notes silently when its changelog pipe is disabled, which is
      # how every release up to 0.2.3 shipped a 1-byte body. Read back what was actually
      # published rather than trusting the flag.
      - name: Verify the published release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          published="$(gh release view "$TAG" --json body --jq '.body')"
          if [ -z "${published//[[:space:]]/}" ]; then
            echo "::error::release $TAG was published with an empty body"
            exit 1
          fi
          printf 'Published body (%s bytes):\n%s\n' "${#published}" "$published"
