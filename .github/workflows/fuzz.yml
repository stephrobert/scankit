name: Fuzz

# Mutation fuzzing, kept off the pull-request path. The seed corpora (including any crasher a
# run below turns into a committed test case) still replay on every `go test` in the Go
# workflow, so the regression value is not in this file — the search for *new* crashers is.
# That search is worth minutes, not seconds: 5 minutes per target nightly finds more than the
# 45 seconds per push it replaces, and costs nobody's feedback loop.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Budget per target, as a Go duration (e.g. 5m, 30m, 2h)'
        required: false
        default: '5m'

permissions: {}

env:
  # Interpolated once, here, and read as a shell variable in the step below — never inlined
  # into a `run:` script (zizmor: template injection).
  FUZZTIME: ${{ inputs.fuzztime || '5m' }}

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false # one red target must not cancel the search in the others
      matrix:
        include:
          - package: ./engine
            target: FuzzEvaluate
          - package: ./report
            target: FuzzRenderers
          - package: ./report
            target: FuzzOSCAL
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod fait foi : `go-version: '1.26'` laisse setup-go réutiliser la
          # version déjà présente sur le runner (1.26.5), qui ne satisfait plus
          # la directive `go` du module avec GOTOOLCHAIN=local.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Fuzz
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: go test "$PACKAGE" -run '^$' -fuzz "^${TARGET}\$" -fuzztime="$FUZZTIME"

      # A crasher is minimized into the package's testdata/fuzz directory. Keep it: it is the
      # input a fix has to be written against, and it becomes the next committed seed.
      - name: Upload crashers
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: Report failure
    needs: fuzz
    # A nightly failure that leaves only a job log is a failure nobody reads. Manual runs
    # report to whoever pressed the button, so they do not open issues.
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          {
            printf 'The scheduled fuzz run failed: %s\n\n' "$RUN_URL"
            cat <<'BODY'
          At least one of `FuzzEvaluate`, `FuzzRenderers` or `FuzzOSCAL` found an input that
          crashes or fails its assertions. The minimized input is attached to that run as a
          `fuzz-crashers-*` artifact.

          To reproduce it and turn it into a permanent regression test:

          1. download the artifact and drop the file under the target's `testdata/fuzz/<Target>/`,
          2. `go test ./<package> -run '<Target>/<file>'` now fails,
          3. fix the code, then commit the seed file: it replays on every `go test` from then on.

          Later red runs comment here rather than opening another issue. Close it once the
          crasher is committed as a seed.
          BODY
          } > "$RUNNER_TEMP/fuzz-issue-body.md"

          # One issue, reused: a red streak is a thread, not a new issue every night.
          number="$(gh issue list --state open --search 'Nightly fuzz run failed in:title' \
            --json number,title \
            --jq 'first(.[] | select(.title == "Nightly fuzz run failed") | .number)')"

          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/fuzz-issue-body.md"
          else
            gh issue create --title 'Nightly fuzz run failed' \
              --body-file "$RUNNER_TEMP/fuzz-issue-body.md"
          fi
