name: Go

# Quality gate for scankit: formatting, vet, build, race-tested units, golangci-lint and
# govulncheck. Mutation fuzzing runs nightly in fuzz.yml, not here — the seed corpora (every
# past crasher) still replay in `go test` below, which is where the regression value is.
# Actions pinned by commit SHA; tools pinned by version.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    name: Build, test, lint, vuln-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod fait foi : `go-version: '1.26'` laisse setup-go réutiliser la
          # version déjà présente sur le runner (1.26.5), qui ne satisfait plus
          # la directive `go` du module avec GOTOOLCHAIN=local.
          go-version-file: go.mod
          # Cache handled below: setup-go keys on go.sum with no fallback, so the run that
          # bumps a dependency — the one that compiles the most — always starts cold.
          cache: false

      - name: Resolve Go cache paths
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # Exact key on go.sum, then a prefix fallback: a dependency bump reuses the previous
      # build cache instead of recompiling the graph from scratch (go verifies every module
      # against go.sum regardless, so a stale restore cannot smuggle anything in).
      - name: Cache Go builds and modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Runs every committed fuzz seed, including past crashers, on top of the unit tests.
      - name: go test (race)
        run: go test -race ./...

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          "$(go env GOPATH)/bin/govulncheck" ./...
