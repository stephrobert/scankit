name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard Analysis
    # Scorecard needs a public repository (commit-graph API + result publication).
    # Skips while the repo is private; activates automatically once public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    # The read-only PAT (repo + read:org) lives in this protected environment, so Scorecard can
    # read the full branch-protection settings its Branch-Protection check needs.
    environment: security
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Elevated read so the Branch-Protection and other checks see the full picture.
          repo_token: ${{ secrets.PLUMBER_ADMIN_TOKEN }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
