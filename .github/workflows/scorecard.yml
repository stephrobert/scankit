name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard Analysis
    # Scorecard needs a public repository (commit-graph API + result publication).
    # Skips while the repo is private; activates automatically once public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    # The read-only PAT (repo + read:org) lives in this protected environment, so Scorecard can
    # read the full branch-protection settings its Branch-Protection check needs.
    environment: security
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two attempts, and this is not superstition.
      #
      # GitHub's GraphQL API intermittently returns an internal error when
      # Scorecard runs RIGHT AFTER a push: "ListCommits: error during
      # graphqlHandler.setup: internal error: githubv4.Query: Something went
      # wrong while executing your query". The commit has just landed and its
      # associated data has not propagated on GitHub's side yet.
      #
      # Measured on 2026-09-15 across the fleet: several push runs failed during
      # a burst of merges, and the SAME repositories analysed cleanly minutes
      # later without a single line having changed. The query was replayed by
      # hand: it passes. So this is not broken data, it is a moment.
      #
      # Without a second attempt the branch stays red for a failure that is not
      # ours, and a red branch people learn to ignore stops being useful.
      - name: Run Scorecard
        id: scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Elevated read so the Branch-Protection and other checks see the full picture.
          repo_token: ${{ secrets.PLUMBER_ADMIN_TOKEN }}

      - name: Let GitHub propagate the commit
        if: steps.scorecard.outcome == 'failure'
        run: sleep 90

      # This one carries NO continue-on-error: if the second attempt fails too,
      # the job fails, which is exactly what we want. A workflow that can no
      # longer fail no longer measures anything.
      - name: Run Scorecard (second attempt)
        if: steps.scorecard.outcome == 'failure'
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Elevated read so the Branch-Protection and other checks see the full picture.
          repo_token: ${{ secrets.PLUMBER_ADMIN_TOKEN }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
