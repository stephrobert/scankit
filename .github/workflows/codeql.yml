name: CodeQL

# Static analysis (SAST) for the Go library: catches injectable/unsafe patterns and dangerous
# APIs that lint alone misses. Code Scanning needs GitHub Advanced Security (free on public
# repos); skips while private.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '24 3 * * 1'

permissions: {}

jobs:
  analyze:
    name: Analyze go
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod fait foi : `go-version: '1.26'` laisse setup-go réutiliser la
          # version déjà présente sur le runner (1.26.5), qui ne satisfait plus
          # la directive `go` du module avec GOTOOLCHAIN=local.
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended,security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: '/language:go'
