name: CodeQL

# Static analysis (SAST) for the Go library: catches injectable/unsafe patterns and dangerous
# APIs that lint alone misses. Code Scanning needs GitHub Advanced Security (free on public
# repos); skips while private.
#
# TWO languages, because the repository is not only Go: the workflows are the
# half that runs with a token, and they were unwatched. `actions` has no build
# to observe, which is why the build mode travels in the matrix next to the
# language rather than being set once for both.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '24 3 * * 1'

permissions: {}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the source of truth. Pinning from the file avoids resolving
          # an older patch release from the runner's preinstalled toolchains.
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:${{ matrix.language }}'
