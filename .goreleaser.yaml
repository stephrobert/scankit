# goreleaser config for scankit. scankit is a LIBRARY: no binary is built. goreleaser is used
# as the recognized publishing workflow (Scorecard Packaging) and to produce a reproducible
# source archive, checksums, an SBOM, and a keyless Cosign signature over the checksums.
version: 2

project_name: scankit

builds:
  - skip: true # library — nothing to compile

source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Tag }}"

checksum:
  name_template: "checksums.txt"

sboms:
  - id: source
    artifacts: source

# No Cosign signing here: the release workflow attaches a native SLSA provenance bundle
# (provenance.intoto.jsonl) which already satisfies Scorecard Signed-Releases. Keeping
# GoReleaser to the artifacts it owns (source archive, checksums, SBOM) avoids the
# signature-name mismatch and keeps the release deterministic.

# The release body is the CHANGELOG section for the tag, handed to goreleaser by the release
# workflow with --release-notes. That flag is only honoured when the changelog pipe runs:
# with `disable: true` goreleaser skips the pipe and publishes an empty body — verified against
# a stub GitHub API, where the create-release call carried `"body":"\n"` with the flag set and
# the CHANGELOG section without it. Hence `disable: false`, explicitly, so nobody flips it back.
changelog:
  disable: false

release:
  github:
    owner: stephrobert
    name: scankit
  draft: false
  prerelease: auto
